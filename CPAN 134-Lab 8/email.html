<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="styles/normalize.css">
	<link rel="stylesheet" href="styles/email.css">
	<meta name="viewport" content="width=device-width, initial-scale:1.0">
	<title>Halloween Store</title>
</head>
<body>
	<header>
		<img src="images/pumpkin.gif" alt="cartoon pumpkin" style="float: left;">
		<h1><i>The Halloween Store</i></h1>
		<h3 id="slogan"><bold>For the little Goblin in all of us!</bold></h3>
	</header>
	<nav>
		<ul id="nav_bar">
			<li><a href="./index.html">Home</a></li>
			<li><a href="./product.html">Product List</a></li>
			<li><a href="./personal/html">Personal</a></li>
			<li><a href="./decorate/html">Decorating Ideas</a></li>
			<li><a href="./join.html" class="active">Join Email</a></li>
		</ul>
	</nav>
	<main style="display: grid; grid-template-columns: 15% 85%; gap:20px;">
		<div><nav id="sidebar">
			<ul style="display: flex; flex-direction: column; list-style-type: none;">
				<a href="products/props.html"><li>Props</li></a>
				<a href="products/costumes.html"><li>Costumes</li></a>
				<a href="products/special.html"><li>Special FX</li></a>
				<a href="products/masks.html"><li>Masks</li></a>
			</ul>
		</nav></div>
		<div id="right_column">
            <h2 style="margin-bottom: 0.5em;"><b>Please enter the following information:</b></h2>
            <form action="subscribe.html" method="GET" style="padding-left: 15px;">
                <label for="fname">First name:</label>
                <input type="text" id="fname" name="fname" required><br>
                <label for="lname">Last name:</label>
                <input type="text" id="lname" name="lname" required><br>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required><br>
                <label for="zipcode">Zip Code:</label>
                <input type="text" id="zipcode" name="zipcode" placeholder="Optional but appreciated: 99999" pattern="^\d{5}$" title="Zip code should be 5 digits">
                <br>
                <button type="submit" style="background-color: orange; color: black;">Subscribe</button>
            </form>
		</div>
	</main>
	<footer>
		<p>&#169; 2018 Ben Murach</p>
	</footer>
</body>
</html>
